version: 2

models:
  - name: int_price_history
    description: >
      Unified price time series across Albert Heijn and Lidl. One row per store per
      product per scrape day, with a normalised discount_pct. Backbone for marts and
      the ML feature layer.
    columns:
      - name: store
        data_tests:
          - not_null
          - accepted_values:
              values: ['albert_heijn', 'lidl']
      - name: product_id
        data_tests: [not_null]
      - name: price
        data_tests: [not_null]
      - name: scrape_date
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [store, product_id, scrape_date]

  - name: int_product_identity
    description: >
      Distinct products per store with an English name (AH via translation memory,
      Lidl via scraper title_eng). Feeds the product dimension and the cross-store
      matching step.
    columns:
      - name: product_id
        data_tests: [not_null]
      - name: product_name_en
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [store, product_id]
