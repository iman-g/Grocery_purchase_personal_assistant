name: Daily Grocery Scrape

# Collects the day's Albert Heijn + Lidl price/offer data and commits the dated CSVs
# to stores/. These committed CSVs are the version-controlled raw data; the DuckDB
# warehouse and dbt models are rebuilt locally from them via warehouse/load.py + dbt.

on:
  schedule:
    # 15:00 UTC daily
    - cron: '0 15 * * *'
  workflow_dispatch:  # allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  scrape-and-translate:
    runs-on: ubuntu-latest
    # Hard ceiling so a stuck/slow run can never eat the whole Actions minutes
    # budget unattended. A cold translation cache once made a run take 4+ hours;
    # file_trans.py now caps new translations per run (AH_MAX_NEW_TRANSLATIONS)
    # so this should normally finish in well under an hour.
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements-scrape.txt

      - name: Create Google credentials file
        env:
          GCP_JSON_KEY: ${{ secrets.GCP_JSON_KEY }}
        run: echo "$GCP_JSON_KEY" > grocery_tracker.json

      - name: Run scrape pipeline
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          # Full catalog scrape every day for real coverage. New-product translation
          # is capped per run (default 3000, see file_trans.py) so a cold-cache day
          # degrades gracefully instead of running for hours.
          AH_MAX_NEW_TRANSLATIONS: "3000"
        run: python run.py

      - name: Organize dated CSVs into stores/
        run: |
          mkdir -p stores
          mv *202*.csv stores/ 2>/dev/null || echo "No dated CSVs to move"

      - name: Commit and push new data
        run: |
          git config --global user.name  "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add stores/*.csv
          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "🤖 Daily Data Update: $(date +'%Y-%m-%d')"
            git push
          fi
